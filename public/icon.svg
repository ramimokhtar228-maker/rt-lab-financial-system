<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.25" />

  <!-- Medical Cross Accent in Corner -->
  <g transform="translate(380, 72) scale(0.65)">
    <rect x="-8" y="-24" width="16" height="48" rx="5" fill="#2dd4bf" />
    <rect x="-24" y="-8" width="48" height="16" rx="5" fill="#2dd4bf" />
  </g>

  <!-- Pulse EKG wave line behind letters -->
  <path d="M 60 350 L 170 350 L 195 315 L 220 395 L 245 285 L 270 370 L 290 350 L 452 350" 
        fill="none" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.35" />

  <!-- Center RT Monogram -->
  <g fill="#ffffff">
    <!-- Letter R -->
    <path d="M 120 160 L 195 160 C 235 160 258 178 258 208 C 258 232 240 248 214 253 L 264 340 L 218 340 L 174 260 L 162 260 L 162 340 L 120 340 Z M 162 225 L 192 225 C 208 225 216 218 216 208 C 216 197 208 192 192 192 L 162 192 Z" />
    
    <!-- Letter T with teal bar cap -->
    <path d="M 280 160 L 400 160 L 400 195 L 362 195 L 362 340 L 318 340 L 318 195 L 280 195 Z" />
  </g>

  <!-- Tagline text LAB -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#2dd4bf" letter-spacing="12" text-anchor="middle">
    DIAGNOSTICS
  </text>
</svg>
